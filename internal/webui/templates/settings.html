{{define "content"}}
<h2>Settings</h2>

<div class="row">
  <div class="col-md-3">
    <ul class="nav nav-pills nav-stacked" id="settings-tabs">
      <li class="active"><a href="#" onclick="switchSettingsTab('global', this); return false;">Global</a></li>
    </ul>
    <p id="module-tabs-loading"><em>Loading modules...</em></p>
  </div>
  <div class="col-md-9">
    <div id="settings-content">
      <p>Loading settings...</p>
    </div>
    <hr>
    <button class="btn btn-primary" onclick="saveSettings()"><span class="glyphicon glyphicon-floppy-disk"></span> Save Changes</button>
    <button class="btn btn-default" onclick="exportSettings()"><span class="glyphicon glyphicon-export"></span> Export</button>
  </div>
</div>
{{end}}

{{define "scripts"}}
<script src="{{.DocRoot}}/static/js/spiderfoot.opts.js"></script>
{{end}}
